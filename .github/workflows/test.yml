name: test

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m ai_work_scheduler --db /tmp/demo.db prompt examples/message.json > /tmp/prompt.json
      - run: python -m ai_work_scheduler --db /tmp/demo.db ingest examples/message.json examples/model_output.json
      - run: python -m ai_work_scheduler --db /tmp/demo.db list
      - run: python -m pip install -e .
      - run: ai-work-scheduler --db /tmp/installed.db ingest examples/message.json examples/model_output.json
